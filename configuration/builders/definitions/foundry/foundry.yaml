---
# Plugins are NOT listed here. Foundry registers one plugin per top-level
# directory containing a CMakeLists.txt, and the dispatcher builder clones
# the repo and discovers them at runtime (DiscoverFoundryPlugins in
# configuration/steps/commands/foundry.py), so adding a plugin to Foundry is
# all it takes to get it built. For a pull request only the plugins it
# touches are built. The whole list is then handed to one
# "cmake -P run.cmake <plugin>..." per builder.
#
# Foundry package builders: one builder per (package, arch) combination.
# "server_builder" is the MariaDB server builder this package mirrors, minus
# its "<arch>-" prefix (see BUILDERS_AUTOBAKE in constants.py). The Foundry
# builder is named "foundry-<arch>-<server_builder>", and packages and logs
# are saved under that name. On the CI side, "<arch>-<server_builder>" is
# the server builder whose MariaDB.repo/mariadb.sources file (or bintar) we
# build against. The same string is the package's name in mariadb_versions.
# "image" is the worker image tag on quay (see image_tag in os_info.yaml),
# which doesn't follow the server builder naming (e.g. centosstream9 for
# centos-stream9, ubuntu22.04 for ubuntu-2204).
packages:
  - server_builder: centos-stream9-rpm-autobake
    image: centosstream9
    type: rpm
    arch: [amd64, aarch64]
  - server_builder: centos-stream10-rpm-autobake
    image: centosstream10
    type: rpm
    arch: [amd64, aarch64]
  - server_builder: rhel-8-rpm-autobake
    image: rhel8
    type: rpm
    arch: [amd64, aarch64]
  - server_builder: rhel-9-rpm-autobake
    image: rhel9
    type: rpm
    arch: [amd64, aarch64]
  - server_builder: rhel-10-rpm-autobake
    image: rhel10
    type: rpm
    arch: [amd64, aarch64]
  - server_builder: debian-11-deb-autobake
    image: debian11
    type: deb
    arch: [amd64, aarch64]
  - server_builder: debian-12-deb-autobake
    image: debian12
    type: deb
    arch: [amd64, aarch64, x86]
  - server_builder: debian-13-deb-autobake
    image: debian13
    type: deb
    arch: [amd64, aarch64]
  - server_builder: ubuntu-2204-deb-autobake
    image: ubuntu22.04
    type: deb
    arch: [amd64, aarch64]
  - server_builder: ubuntu-2404-deb-autobake
    image: ubuntu24.04
    type: deb
    arch: [amd64, aarch64]
  - server_builder: ubuntu-2604-deb-autobake
    image: ubuntu26.04
    type: deb
    arch: [amd64, aarch64]
  # sles/opensuse images only exist for amd64 -- see os_info.yaml.
  - server_builder: sles-1507-rpm-autobake
    image: sles1507
    type: rpm
    arch: [amd64]
  - server_builder: sles-1600-rpm-autobake
    image: sles1600
    type: rpm
    arch: [amd64]
  - server_builder: opensuse-1600-rpm-autobake
    image: opensuse1600
    type: rpm
    arch: [amd64]
  # Bintar builds: the plugin is built against a MariaDB server bintar
  # instead of installed -devel packages -- see autobake.bintar. Only one
  # image builds bintars per MariaDB version range: centos7 up to 11.4,
  # almalinux8 from 11.8 on (see mariadb_versions below). On the CI side the
  # bintar comes from the server builder under the dispatched tarbuildnum;
  # mirror-sourced runs take the GA release bintar instead (a single
  # linux-systemd-x86_64 tarball, the same one for every builder). x86_64
  # only, hence arch: [amd64].
  - server_builder: centos-7-bintar
    image: centos7-bintar
    type: bintar
    arch: [amd64]
  - server_builder: almalinux-8-bintar
    image: almalinux8-bintar
    type: bintar
    arch: [amd64]

# Supported MariaDB versions: which packages get built for each. Add or
# remove a version here to change both what "foundry-trigger-builders"
# dispatches and what foundry_force_scheduler asks about.
#
# Where the server packages come from is no longer pinned here -- the force
# scheduler asks per version, offering "use the MariaDB Server mirrors" (the
# default), "use a ci.mariadb.org tarball" (with a tarbuildnum to go with it)
# or "skip this version". See sources.py.
#
# The version key doubles as the mirror path segment, so it has to be a
# directory published under https://mirror.mariadb.org/repo/ (deb) and
# https://mirror.mariadb.org/yum/ (rpm), with a matching mariadb-<version>.<z>
# GA release at https://mirror.mariadb.org/ for the bintar builders -- and
# each package listed for it has to be one the mirrors carry for that version.
# Those differ per branch: 11.4 has no sles-15.7/16.0 or opensuse-16.0 repo,
# while 11.8 does, which is why the SUSE packages are only listed from 11.8 on.
# GitHub usernames allowed to force the dispatcher (see
# configuration/schedulers/foundry.py).
force_users: []

mariadb_versions:
  "11.4":
    packages:
      - centos-stream9-rpm-autobake
      - centos-stream10-rpm-autobake
      - rhel-8-rpm-autobake
      - rhel-9-rpm-autobake
      - rhel-10-rpm-autobake
      - debian-11-deb-autobake
      - debian-12-deb-autobake
      - ubuntu-2204-deb-autobake
      - ubuntu-2404-deb-autobake
      - centos-7-bintar
  # "11.8":
