---
# Foundry CI configuration -- the one place to adjust the Foundry pipeline.
# See README.md next to this file for how the pipeline works.
#
# Plugins are not listed here: the dispatcher discovers them in the Foundry
# checkout (every top-level directory with a CMakeLists.txt).

# ---------------------------------------------------------------------------
# Repository
# ---------------------------------------------------------------------------
repository:
  url: https://github.com/MariaDB/foundry
  project: MariaDB/foundry
  branch: main                        # built when Force is given no commit

# ---------------------------------------------------------------------------
# Access
# ---------------------------------------------------------------------------
access:
  force_users: []                     # GitHub usernames allowed to press Force

# ---------------------------------------------------------------------------
# Server packages
#   Picked per MariaDB version on Force: mirrors (default), a CI tarbuildnum,
#   or skip. Pull requests always use the mirrors.
# ---------------------------------------------------------------------------
server:
  ci_url: https://ci.mariadb.org      # TEMPORARY: production CI while dev-only
  mirror_url: https://mirror.mariadb.org

# ---------------------------------------------------------------------------
# Dispatcher
#   Clones Foundry, discovers plugins, triggers the package builders.
# ---------------------------------------------------------------------------
dispatcher:
  builder: foundry-trigger-builders
  image: debian12                     # only needs git; runs on the amd64 pool

# ---------------------------------------------------------------------------
# Architectures
#   Overrides for arches whose image isn't in the multi-arch manifest.
# ---------------------------------------------------------------------------
arch:
  x86: { image_suffix: "-386", platform: linux/386 }

# ---------------------------------------------------------------------------
# Packages
#   One section per package family. Each target is keyed by its MariaDB
#   server builder name, minus the "<arch>-" prefix:
#     builder       foundry-<arch>-<target>
#     CI source     <ci_url>/<tarbuildnum>/<arch>-<target>/
#     image         worker image tag on quay (image_tag in os_info.yaml)
# ---------------------------------------------------------------------------
packages:

  rpm:
    repo_file: MariaDB.repo           # published by the CI server builder
    mirror_path: yum                  # <mirror_url>/yum/<version>/<os>/<os_version>/<arch>/
    build_packages: [MariaDB-devel]
    test_packages: [MariaDB-server, MariaDB-test]
    targets:
      centos-stream9-rpm-autobake:  { image: centosstream9,  arch: [amd64, aarch64] }
      centos-stream10-rpm-autobake: { image: centosstream10, arch: [amd64, aarch64] }
      rhel-8-rpm-autobake:          { image: rhel8,          arch: [amd64, aarch64] }
      rhel-9-rpm-autobake:          { image: rhel9,          arch: [amd64, aarch64] }
      rhel-10-rpm-autobake:         { image: rhel10,         arch: [amd64, aarch64] }
      sles-1507-rpm-autobake:       { image: sles1507,       arch: [amd64] }
      sles-1600-rpm-autobake:       { image: sles1600,       arch: [amd64] }
      opensuse-1600-rpm-autobake:   { image: opensuse1600,   arch: [amd64] }

  deb:
    repo_file: mariadb.sources        # published by the CI server builder
    mirror_path: repo                 # <mirror_url>/repo/<version>/<os> <codename> main
    build_packages: [libmariadb-dev]
    test_packages: [mariadb-server, mariadb-test]
    targets:
      debian-12-deb-autobake:       { image: debian12,       arch: [amd64, aarch64, x86] }
      debian-13-deb-autobake:       { image: debian13,       arch: [amd64, aarch64] }
      ubuntu-2204-deb-autobake:     { image: ubuntu22.04,    arch: [amd64, aarch64] }
      ubuntu-2404-deb-autobake:     { image: ubuntu24.04,    arch: [amd64, aarch64] }
      ubuntu-2604-deb-autobake:     { image: ubuntu26.04,    arch: [amd64, aarch64] }

  # Built against an unpacked server bintar instead of -devel packages.
  # centos7 serves up to 11.4, almalinux8 from 11.8 on.
  bintar:
    mirror_bintar: bintar-linux-systemd-x86_64   # the only flavour mirrored, hence amd64 only
    targets:
      centos-7-bintar:              { image: centos7-bintar,    arch: [amd64] }
      almalinux-8-bintar:           { image: almalinux8-bintar, arch: [amd64] }

# ---------------------------------------------------------------------------
# MariaDB versions
#   targets   built on every run. The version must be a directory on the
#             mirrors (yum/<version>, repo/<version>) with a GA release, and
#             each target must be on the mirrors for it.
#   ci_only   platforms whose server builders publish to CI but that haven't
#             reached the mirrors yet (they only get there at release time).
#             Built only when Force picks a CI tarbuildnum for the version;
#             skipped on mirror runs and pull requests. Move a target up to
#             "targets" once a release has put it on the mirrors.
# ---------------------------------------------------------------------------
mariadb_versions:

  "11.4":
    targets:
      - centos-stream9-rpm-autobake
      - centos-stream10-rpm-autobake
      - rhel-8-rpm-autobake
      - rhel-9-rpm-autobake
      - rhel-10-rpm-autobake
      - debian-12-deb-autobake
      - ubuntu-2204-deb-autobake
      - ubuntu-2404-deb-autobake
      - centos-7-bintar
    ci_only: []

  # "11.8":
  #   targets:
  #     - centos-stream9-rpm-autobake
  #     - centos-stream10-rpm-autobake
  #     - rhel-8-rpm-autobake
  #     - rhel-9-rpm-autobake
  #     - rhel-10-rpm-autobake
  #     - sles-1507-rpm-autobake
  #     - sles-1600-rpm-autobake
  #     - opensuse-1600-rpm-autobake
  #     - debian-12-deb-autobake
  #     - debian-13-deb-autobake
  #     - ubuntu-2204-deb-autobake
  #     - ubuntu-2404-deb-autobake
  #     - ubuntu-2604-deb-autobake
  #     - almalinux-8-bintar
  #   ci_only: []
